<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      let commentsData = [
        {
          id: "comment-1",
          name: "Глеб Фокин",
          date: "12.02.22",
          time: "12:18",
          text: "Это будет первый комментарий на этой странице",
          likes: 3,
          liked: false
        },
        {
          id: "comment-2",
          name: "Варвара Н.",
          date: "13.02.22",
          time: "19:22",
          text: "Мне нравится как оформлена эта страница! ❤",
          likes: 75,
          liked: true
        }
      ];


      function renderComments() {
        const commentsList = document.querySelector(".comments");
        commentsList.innerHTML = "";

        commentsData.forEach((comment) => {
          const commentHTML = `
            <li class="comment">
              <div class="comment-header">
                <div>${comment.name}</div>
                <div>${comment.date} ${comment.time}</div>
              </div>
              <div class="comment-body">
                <div class="comment-text">${comment.text}</div>
              </div>
              <div class="comment-footer">
                <div class="likes">
                  <span class="likes-counter">${comment.likes}</span>
                  <button class="like-button ${comment.liked ? "-active-like" : ""}"></button>
                </div>
              </div>
            </li>
          `;
          commentsList.insertAdjacentHTML("beforeend", commentHTML);
        });

        const likeButtons = document.querySelectorAll(".like-button");
        likeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const commentElement = button.closest(".comment");
            const index = Array.from(document.querySelectorAll(".comment")).indexOf(commentElement);
            const comment = commentsData[index];

            comment.liked = !comment.liked;
            comment.likes = comment.liked ? comment.likes + 1 : comment.likes - 1;

            renderComments();
          });
        });
      }

      
      function updatePlaceholder() {
        const nameInput = document.querySelector(".add-form-name");
        const textInput = document.querySelector(".add-form-text");

        if (nameInput.value.trim() !== "" || textInput.value.trim() !== "") {
          nameInput.placeholder = "Имя";
          textInput.placeholder = "Комментарий";
        } else {
          nameInput.placeholder = "Введите ваше имя";
          textInput.placeholder = "Введите ваш коментарий";
        }
      }

      document
        .querySelector(".add-form-name")
        .addEventListener("input", updatePlaceholder);
      document
        .querySelector(".add-form-text")
        .addEventListener("input", updatePlaceholder);

      document
        .querySelector(".add-form-button")
        .addEventListener("click", () => {
          const nameInput = document.querySelector(".add-form-name");
          const textInput = document.querySelector(".add-form-text");

          const name = nameInput.value.trim();
          const text = textInput.value.trim();

          if (!name || !text) {
            alert("Имя и комментарий обязательны!");
            return;
          }

          const now = new Date();
          const date = now.toLocaleDateString("ru-RU");
          const time = now.toLocaleTimeString("ru-RU", {
            hour: "2-digit",
            minute: "2-digit",
          });

          const newComment = {
            id: `comment-${Date.now()}`,
            name: name,
            date: date,
            time: time,
            text: text,
            likes: 0,
            liked: false,
          };

          commentsData.push(newComment);

          renderComments();

          nameInput.value = "";
          textInput.value = "";
          updatePlaceholder();
        });

      renderComments();
    </script>
  </body>
</html>
