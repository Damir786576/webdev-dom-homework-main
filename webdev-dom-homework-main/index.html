```html
<!DOCTYPE html>
<html lang="ru">
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments"></ul>

      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />

        <textarea
          class="add-form-text"
          placeholder="Введите ваш комментарий"
          rows="4"
        ></textarea>

        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";

      let commentsData = [
        {
          id: "comment-1",
          name: "Глеб Фокин",
          date: "12.02.22",
          time: "12:18",
          text: "Это будет первый комментарий на этой странице",
          likes: 3,
          liked: false,
        },
        {
          id: "comment-2",
          name: "Варвара Н.",
          date: "13.02.22",
          time: "19:22",
          text: "Мне нравится как оформлена эта страница! ❤",
          likes: 75,
          liked: true,
        },
      ];

      function escapeHTML(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderComments() {
        const commentsList = document.querySelector(".comments");

        commentsList.innerHTML = "";

        commentsData.forEach((comment) => {
          const commentHTML = `
            <li class="comment" data-comment-id="${escapeHTML(comment.id)}">
              <div class="comment-header">
                <div>${escapeHTML(comment.name)}</div>
                <div>${escapeHTML(comment.date)} ${escapeHTML(comment.time)}</div>
              </div>

              <div class="comment-body">
                <div class="comment-text">${escapeHTML(comment.text)}</div>
              </div>

              <div class="comment-footer">
                <div class="likes">
                  <span class="likes-counter">${comment.likes}</span>

                  <button
                    class="like-button ${comment.liked ? "-active-like" : ""}"
                    aria-label="Поставить лайк"
                    type="button"
                  ></button>
                </div>
              </div>
            </li>
          `;

          commentsList.insertAdjacentHTML("beforeend", commentHTML);
        });

        const likeButtons = document.querySelectorAll(".like-button");

        likeButtons.forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();

            const commentElement = button.closest(".comment");
            const commentId = commentElement.dataset.commentId;

            const comment = commentsData.find(
              (item) => item.id === commentId
            );

            if (!comment) {
              return;
            }

            comment.liked = !comment.liked;

            comment.likes = comment.liked
              ? comment.likes + 1
              : comment.likes - 1;

            renderComments();
          });
        });

        const commentElements = document.querySelectorAll(".comment");

        commentElements.forEach((commentElement) => {
          commentElement.addEventListener("click", (event) => {
            if (event.target.closest(".like-button")) {
              return;
            }

            const commentId = commentElement.dataset.commentId;

            const comment = commentsData.find(
              (item) => item.id === commentId
            );

            if (!comment) {
              return;
            }

            const nameInput = document.querySelector(".add-form-name");
            const textInput = document.querySelector(".add-form-text");

            nameInput.value = comment.name;
            textInput.value = `> ${comment.text}\n`;

            updatePlaceholder();

            textInput.focus();
            textInput.setSelectionRange(
              textInput.value.length,
              textInput.value.length
            );
          });
        });
      }

      function updatePlaceholder() {
        const nameInput = document.querySelector(".add-form-name");
        const textInput = document.querySelector(".add-form-text");

        if (
          nameInput.value.trim() !== "" ||
          textInput.value.trim() !== ""
        ) {
          nameInput.placeholder = "Имя";
          textInput.placeholder = "Комментарий";
        } else {
          nameInput.placeholder = "Введите ваше имя";
          textInput.placeholder = "Введите ваш комментарий";
        }
      }

      document
        .querySelector(".add-form-name")
        .addEventListener("input", updatePlaceholder);

      document
        .querySelector(".add-form-text")
        .addEventListener("input", updatePlaceholder);

      document
        .querySelector(".add-form-button")
        .addEventListener("click", () => {
          const nameInput = document.querySelector(".add-form-name");
          const textInput = document.querySelector(".add-form-text");

          const name = nameInput.value.trim();
          const text = textInput.value.trim();

          if (!name || !text) {
            alert("Имя и комментарий обязательны!");
            return;
          }

          const now = new Date();

          const date = now.toLocaleDateString("ru-RU");

          const time = now.toLocaleTimeString("ru-RU", {
            hour: "2-digit",
            minute: "2-digit",
          });

          const newComment = {
            id: `comment-${Date.now()}`,
            name: name,
            date: date,
            time: time,
            text: text,
            likes: 0,
            liked: false,
          };

          commentsData.push(newComment);

          renderComments();

          nameInput.value = "";
          textInput.value = "";

          updatePlaceholder();
        });

      renderComments();
    </script>
  </body>
</html>
```
